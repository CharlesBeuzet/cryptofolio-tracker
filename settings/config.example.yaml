# Crypto Portfolio Tracker Configuration
# Copy this file to config.yaml and fill in your actual credentials
# config.yaml is gitignored and will not be committed to the repository

# Binance Exchange Configuration
binance:
  api_key: "your_binance_api_key_here"
  api_secret: "your_binance_api_secret_here"
  # Optional: enable testnet
  # sandbox: false

# OKX Exchange Configuration
okx:
  api_key: "your_okx_api_key_here"
  api_secret: "your_okx_api_secret_here"
  passphrase: "your_okx_passphrase_here"
  # Optional: REST API hostname where the API key was created (ccxt default: www.okx.com)
  # Examples: openapi.okx.com (global), my.okx.com (EEA), us.okx.com (US)
  # hostname: "openapi.okx.com"
  # Optional: enable demo trading (sandbox)
  # sandbox: false

# Coinbase Exchange Configuration
coinbase:
  api_key: "your_coinbase_api_key_here"
  api_secret: "your_coinbase_api_secret_here"
  passphrase: "your_coinbase_passphrase_here"
  # Optional: enable sandbox
  # sandbox: false

# Ethereum hot wallet (same connector shape as exchanges)
ethereum:
  # JSON-RPC endpoint (optional; public defaults may be used later)
  hostname: "https://eth.llamarpc.com"
  # Public wallet address to track (required)
  address: "0xYourEthereumAddressHere"

# Notes:
# - For exchanges: Only provide API keys with read-only permissions for security
# - For hot wallets: Only a public address is needed (no private keys required)
# - RPC hostname: Free public RPCs are fine to start; use your own for better reliability
# - Asset price history is fetched on demand from exchange APIs and never stored in portfolio.db

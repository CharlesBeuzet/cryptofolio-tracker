# Crypto Portfolio Tracker Configuration
# Copy this file to config.yaml and fill in your actual credentials
# config.yaml is gitignored and will not be committed to the repository

# Binance Exchange Configuration
binance:
  api_key: "your_binance_api_key_here"
  api_secret: "your_binance_api_secret_here"
  # Optional: enable testnet
  # sandbox: false

# OKX Exchange Configuration
okx:
  api_key: "your_okx_api_key_here"
  api_secret: "your_okx_api_secret_here"
  passphrase: "your_okx_passphrase_here"
  # Optional: REST API hostname where the API key was created (ccxt default: www.okx.com)
  # Examples: openapi.okx.com (global), my.okx.com (EEA), us.okx.com (US)
  # hostname: "openapi.okx.com"
  # Optional: enable demo trading (sandbox)
  # sandbox: false

# Coinbase Exchange Configuration
coinbase:
  api_key: "your_coinbase_api_key_here"
  api_secret: "your_coinbase_api_secret_here"
  passphrase: "your_coinbase_passphrase_here"
  # Optional: enable sandbox
  # sandbox: false

# Helius Solana Wallet Configuration (on-chain tokens not on CEX)
helius:
  api_key: "your_helius_api_key_here"
  wallet_address: "YourSolanaWalletAddressHere"
  # Optional: track multiple wallets
  # wallet_addresses:
  #   - "AnotherSolanaWalletAddress"
  # CoinGecko API key for OHLCV charts and price fallback (Pro/Demo key)
  coingecko_api_key: "your_coingecko_api_key_here"
  # Optional: explicit SPL token metadata when Helius omits symbol or CoinGecko is ambiguous
  # tokens:
  #   BONK:
  #     mint: "DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263"
  #     coingecko_id: "bonk"

# CoinGecko API (optional global key; helius.coingecko_api_key takes precedence for that connector)
coingecko:
  api_key: "your_coingecko_api_key_here"

# Hot Wallets Configuration
hot_wallets:
  # Default RPC endpoint (used if chain-specific RPC not provided)
  default_rpc: "https://eth.llamarpc.com"
  
  # Chain-specific RPC URLs (optional, falls back to default_rpc)
  rpc_urls:
    ethereum: "https://eth.llamarpc.com"
    # polygon: "https://polygon-rpc.com"
    # bsc: "https://bsc-dataseed.binance.org"
  
  # List of wallet addresses to track
  addresses:
    - address: "0xYourEthereumAddressHere"
      chain: "ethereum"
      # Optional: List of ERC-20 tokens to track on this address
      tokens:
        - address: "0xTokenContractAddress"
          symbol: "USDC"
          decimals: 6
        - address: "0xAnotherTokenContractAddress"
          symbol: "DAI"
          decimals: 18
    # Add more addresses as needed
    # - address: "0xAnotherAddress"
    #   chain: "ethereum"
    #   tokens: []

# Notes:
# - For exchanges: Only provide API keys with read-only permissions for security
# - For hot wallets: Only public addresses are needed (no private keys required)
# - RPC endpoints: Free public RPCs are used by default, but you can use your own for better reliability
# - Asset price history is fetched on demand (CEX APIs or CoinGecko for on-chain) and never stored in portfolio.db

